# -----------------------------------------------------------------------------
# SFT (Supervised Fine-Tuning) Configuration
# -----------------------------------------------------------------------------
# Configuration for the initial Supervised Fine-Tuning stage.

# --- Global & Paths ---
output_dir: "${models_dir}/sft"           # Directory to save model checkpoints

# --- Batching & Steps ---
per_device_train_batch_size: 1            # Batch size per GPU
gradient_accumulation_steps: 8            # Number of steps to accumulate gradients
num_train_epochs: 15                      # Total number of training epochs
max_steps: 250                            # Override epochs with max steps if set

# --- Optimization ---
learning_rate: 2e-5                       # Initial learning rate
warmup_ratio: 0.05                        # Proportion of steps for learning rate warmup
optim: "adamw_torch"                      # Optimizer type
bf16: true                                # Use bfloat16 precision

# --- Logging & Saving ---
logging_steps: 2                          # How often to log training metrics
save_steps: 500                           # How often to save a checkpoint
save_total_limit: 3                       # Maximum number of checkpoints to keep
report_to: "wandb"                        # Integration to report metrics to

# --- Sequence & Data ---
max_seq_length: 2048                      # Maximum sequence length for inputs
packing: false                            # Whether to pack multiple short examples into one sequence
