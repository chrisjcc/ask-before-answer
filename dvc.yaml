stages:

  # ----------------------------
  # SHARED PREPROCESSING
  # ----------------------------
  preprocess:
    cmd: python scripts/preprocess_data.py
    deps:
      - scripts/preprocess_data.py
      - src/ask_before_answer/data/preprocess.py
      - configs/data/ambignq.yaml
    outs:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl

  # ----------------------------
  # FULL PIPELINE (SFT → DPO)
  # ----------------------------
  train-sft:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_sft.py
      training.learning_rate=${training.sft.learning_rate}
    deps:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - configs/training/sft.yaml
      - configs/model/qwen2_5_7b.yaml
    params:
      - training.sft.learning_rate
    outs:
      - models/sft/final


  train-dpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_dpo.py
      training=dpo
      model.name=models/sft/final
      training.learning_rate=${training.dpo.learning_rate}
      training.beta=${training.dpo.beta}
    deps:
      - models/sft/final
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/dpo.yaml
    params:
      - training.dpo.learning_rate
      - training.dpo.beta
    outs:
      - models/dpo/final


  # ----------------------------
  # ABLATION: SFT ONLY
  # ----------------------------
  train-sft-only:
    cmd: CUDA_VISIBLE_DEVICES=0 python scripts/train_sft.py training.output_dir=models/sft_only
    deps:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - configs/training/sft.yaml
      - configs/model/qwen2_5_7b.yaml
    outs:
      - models/sft_only/final


  # ----------------------------
  # ABLATION: DPO ONLY
  # ----------------------------
  train-dpo-only:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_dpo.py
      training=dpo
      training.output_dir=models/dpo_only
    deps:
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/dpo.yaml
      - configs/model/qwen2_5_7b.yaml
    outs:
      - models/dpo_only/final


  # ----------------------------
  # ABLATION: ORPO ONLY
  # ----------------------------
  train-orpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_orpo.py
      training=orpo
      training.learning_rate=${training.orpo.learning_rate}
      training.beta=${training.orpo.beta}
    deps:
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/orpo.yaml
      - configs/model/qwen2_5_7b.yaml
    params:
      - training.orpo.learning_rate
      - training.orpo.beta
    outs:
      - models/orpo/final


  # ----------------------------
  # ABLATION: GRPO ONLY
  # ----------------------------
  train-grpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_grpo.py
      training=grpo
      model.name=models/sft/final
      training.learning_rate=${training.grpo.learning_rate}
      training.beta=${training.grpo.beta}
    deps:
      - models/sft/final
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/grpo.yaml
    params:
      - training.grpo.learning_rate
      - training.grpo.beta
    outs:
      - models/grpo/final


