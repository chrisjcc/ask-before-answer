name: orpo-bayes-hyperband
description: >
  Bayesian hyperparameter sweep for the train_orpo pipeline.
  Searches the ORPO beta coefficient and learning rate while maximizing
  eval/rewards/accuracies using Hyperband early stopping.

project: ask-before-answer

program: scripts/run_sweep_trial.py

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--stage"
  - "train_orpo"
  - ${args}

method: bayes

metric:
  name: eval/rewards/accuracies
  goal: maximize

# Enable Hyperband Early Stopping
early_terminate:
  type: hyperband
  min_iter: 50
  eta: 3

parameters:
  beta:
    distribution: uniform
    min: 0.01
    max: 0.2

  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
