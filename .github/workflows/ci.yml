name: AskBeforeAnswer CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sed -i 's/cu121/cpu/g' requirements.txt
        sed -i 's/torch==2.5.1/torch==2.5.1+cpu/g' requirements.txt
        sed -i 's/torchvision==0.20.1/torchvision==0.20.1+cpu/g' requirements.txt
        sed -i 's/torchaudio==2.5.1/torchaudio==2.5.1+cpu/g' requirements.txt
        pip install -r requirements.txt
        pip uninstall -y torchao || true
        pip install black ruff pytest
        pip install -e .
        
    - name: Lint with ruff
      run: |
        ruff check src scripts tests app
        
    - name: Format check with black
      run: |
        black --check src scripts tests app
        
    - name: Run tests
      env:
        USE_TF: "0"
      run: |
        pytest tests/

  deploy-to-hf:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Setup Git
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        
        # Clone the HF Space repository (with exponential backoff for 429 Rate Limits)
        delay=15
        for i in {1..6}; do
          git clone https://chrisjcc:${HF_TOKEN}@huggingface.co/spaces/chrisjcc/ask-before-answer-demo hf_space && break || {
            echo "Clone failed, retrying in ${delay}s..."
            sleep $delay
            delay=$((delay * 2))
          }
        done
        
        if [ ! -d "hf_space" ]; then
          echo "Failed to clone HF Space repository after multiple retries."
          exit 1
        fi
        cd hf_space
        
        # Clean existing files (except .git) to allow for deletions
        find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +
        
        # Copy essential runtime files from the GitHub repo
        cp ../Dockerfile .
        
        # (The Dockerfile will natively use app/requirements.txt)
        
        cp ../pyproject.toml .
        cp -r ../app .
        cp -r ../src .
        
        # Copy the specific Hugging Face README as the root README.md
        cp ../.github/hf_space_readme.md README.md
        
        # Commit and Push (with exponential backoff for 429 Rate Limits)
        git add .
        git commit -m "Automated deployment from GitHub Actions: ${GITHUB_SHA}" || echo "No changes to commit"
        delay=15
        for i in {1..6}; do
          git push origin main && break || {
            echo "Push failed, retrying in ${delay}s..."
            sleep $delay
            delay=$((delay * 2))
          }
        done

