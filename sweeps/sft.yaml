# -----------------------------------------------------------------------------
# SFT Sweep Configuration
# -----------------------------------------------------------------------------
# Weights & Biases Bayesian sweep configuration for SFT hyperparameter search.

# --- Sweep Settings ---
name: sft-bayes-hyperband
description: >
  Bayesian hyperparameter sweep for the train-sft pipeline.
  Searches SFT learning rate and epochs while maximizing eval/action_f1_answer using
  Hyperband early stopping
project: ask-before-answer
program: scripts/run_sweep_trial.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--stage"
  - "train-sft"
  - ${args}
method: bayes
metric:
  name: eval/loss
  goal: minimize

# Enable Hyperband Early Stopping
early_terminate:
  type: hyperband
  min_iter: 50    # Hyperband's first bracket is based on 50 logged
                  # iterations of the optimized metric (eval/loss).
  eta: 3          # Hyperband bracket multiplier.

# --- Parameters ---
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0005
