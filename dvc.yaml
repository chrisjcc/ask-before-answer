stages:

  # ----------------------------
  # SHARED PREPROCESSING
  # ----------------------------
  preprocess:
    cmd: python scripts/preprocess_data.py
    deps:
      - scripts/preprocess_data.py
      - src/data/preprocess.py
      - configs/data/ambignq.yaml
    outs:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl

  # ----------------------------
  # FULL PIPELINE (SFT → DPO)
  # ----------------------------
  train_sft:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_sft.py
      training.learning_rate=${training.sft.learning_rate}
    deps:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - configs/training/sft.yaml
      - configs/model/qwen2_5_7b.yaml
    params:
      - training.sft.learning_rate
    outs:
      - models/sft/final

  evaluate_sft:
    cmd: python scripts/evaluate.py model_name=sft
    deps:
      - models/sft/final
    metrics:
      - results/sft_metrics.json:
          cache: false

  train_dpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_dpo.py
      training=dpo
      model.name=models/sft/final
      training.learning_rate=${training.dpo.learning_rate}
      training.beta=${training.dpo.beta}
    deps:
      - models/sft/final
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/dpo.yaml
    params:
      - training.dpo.learning_rate
      - training.dpo.beta
    outs:
      - models/dpo/final

  evaluate_dpo:
    cmd: python scripts/evaluate.py model_name=dpo
    deps:
      - models/dpo/final
    metrics:
      - results/dpo_metrics.json:
          cache: false

  # ----------------------------
  # ABLATION: SFT ONLY
  # ----------------------------
  train_sft_only:
    cmd: CUDA_VISIBLE_DEVICES=0 python scripts/train_sft.py training.output_dir=models/sft_only
    deps:
      - data/sft_train.jsonl
      - data/sft_val.jsonl
      - configs/training/sft.yaml
      - configs/model/qwen2_5_7b.yaml
    outs:
      - models/sft_only/final

  evaluate_sft_only:
    cmd: python scripts/evaluate.py model_name=sft_only
    deps:
      - models/sft_only/final
    metrics:
      - results/sft_only_metrics.json:
          cache: false

  # ----------------------------
  # ABLATION: DPO ONLY
  # ----------------------------
  train_dpo_only:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_dpo.py
      training=dpo
      training.output_dir=models/dpo_only
    deps:
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/dpo.yaml
      - configs/model/qwen2_5_7b.yaml
    outs:
      - models/dpo_only/final

  evaluate_dpo_only:
    cmd: python scripts/evaluate.py model_name=dpo_only
    deps:
      - models/dpo_only/final
    metrics:
      - results/dpo_only_metrics.json:
          cache: false

  # ----------------------------
  # ABLATION: ORPO ONLY
  # ----------------------------
  train_orpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_orpo.py
      training=orpo
      training.learning_rate=${training.orpo.learning_rate}
      training.beta=${training.orpo.beta}
    deps:
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/orpo.yaml
      - configs/model/qwen2_5_7b.yaml
    params:
      - training.orpo.learning_rate
      - training.orpo.beta
    outs:
      - models/orpo/final

  evaluate_orpo:
    cmd: python scripts/evaluate.py model_name=orpo
    deps:
      - models/orpo/final
      - configs/training/orpo.yaml
    metrics:
      - results/orpo_metrics.json:
          cache: false

  # ----------------------------
  # ABLATION: GRPO ONLY
  # ----------------------------
  train_grpo:
    cmd: >
      CUDA_VISIBLE_DEVICES=0
      python scripts/train_grpo.py
      training=grpo
      model.name=models/sft/final
      training.learning_rate=${training.grpo.learning_rate}
      training.beta=${training.grpo.beta}
    deps:
      - models/sft/final
      - data/dpo_train.jsonl
      - data/dpo_val.jsonl
      - configs/training/grpo.yaml
    params:
      - training.grpo.learning_rate
      - training.grpo.beta
    outs:
      - models/grpo/final

  evaluate_grpo:
    cmd: python scripts/evaluate.py model_name=grpo
    deps:
      - models/grpo/final
    metrics:
      - results/grpo_metrics.json:
          cache: false
