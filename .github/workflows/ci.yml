name: AskBeforeAnswer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install CI dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Install package
        run: |
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check src scripts tests app

      - name: Check formatting with Black
        run: |
          black --check src scripts tests app

      - name: Check import ordering with isort
        run: |
          isort --check-only src scripts tests app

      - name: Lint YAML with yamllint
        run: |
          yamllint .

      - name: Run tests
        env:
          USE_TF: "0"
        run: |
          pytest tests/

  diagram-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node dependencies
        run: npm ci

      - name: Show diagram rendering environment
        run: |
          node --version
          npm --version
          npx mmdc --version

      - name: Regenerate diagram
        run: make diagram

      - name: Fail if SVG is out of date
        run: git diff --exit-code assets/architecture.svg
