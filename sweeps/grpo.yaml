name: grpo-bayes-hyperband
description: >
  Bayesian hyperparameter sweep for the train_grpo pipeline.
  Searches GRPO beta and learning rate while maximizing eval/reward/accuracy using
  Hyperband early stopping
project: ask-before-answer
program: scripts/run_sweep_trial.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--stage"
  - "train_grpo"
  - ${args}
method: bayes
metric:
  name: eval/reward/accuracy
  goal: maximize

# Enable Hyperband Early Stopping
early_terminate:
  type: hyperband
  min_iter: 50    # Hyperband's first bracket is based on 50 logged
                  # iterations of the optimized metric (eval/loss).
  eta: 3          # Hyperband bracket multiplier.

parameters:
  beta:
    distribution: uniform
    min: 0.01
    max: 0.2
  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
