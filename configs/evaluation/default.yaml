base_model_id: "unsloth/qwen2.5-7b-instruct-unsloth-bnb-4bit"

dataset_name: "sewon/ambig_qa"
split: "validation"
config_name: "light"
max_samples: 50
judge_model: "google/gemma-2-2b-it"
models_to_evaluate:
  - name: "base"
    path: "${evaluation.base_model_id}"
    is_peft: false
  - name: "sft_only"
    path: "models/sft_only/final"
    is_peft: true
  - name: "dpo_only"
    path: "models/dpo_only/final"
    is_peft: true
  - name: "sft"
    path: "models/sft/final"
    is_peft: true
  - name: "sft_dpo"
    path: "models/dpo/final"
    is_peft: true
  - name: "clarifier_lora"
    path: "itsbhoomika/clarifier-dpo-lora"
    is_peft: true
  - name: "orpo"
    path: "models/orpo/final"
    is_peft: true
  - name: "grpo"
    path: "models/grpo/final"
    is_peft: true
