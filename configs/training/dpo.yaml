# -----------------------------------------------------------------------------
# DPO (Direct Preference Optimization) Configuration
# -----------------------------------------------------------------------------
# Configuration for aligning the model to preferences using DPO.

# --- Global & Paths ---
output_dir: ${models_dir}/dpo             # Directory to save model checkpoints

# --- Batching & Steps ---
per_device_train_batch_size: 1            # Batch size per GPU
gradient_accumulation_steps: 8            # Number of steps to accumulate gradients
num_train_epochs: 3                       # Total number of training epochs
max_steps: 250                            # Override epochs with max steps if set

# --- Optimization & Loss ---
learning_rate: 5e-7                       # Initial learning rate
warmup_ratio: 0.1                         # Proportion of steps for learning rate warmup
optim: adamw_torch                        # Optimizer type
bf16: true                                # Use bfloat16 precision
beta: 0.1                                 # Temperature parameter for DPO loss

# --- Logging & Saving ---
logging_steps: 2                          # How often to log training metrics
save_steps: 200                           # How often to save a checkpoint
save_total_limit: 2                       # Maximum number of checkpoints to keep
report_to: wandb                          # Integration to report metrics to

# --- Sequence & Data ---
remove_unused_columns: false              # Whether to remove unused columns from the dataset
max_prompt_length: 1024                   # Maximum length of the prompt sequence
max_length: 2048                          # Maximum total sequence length
