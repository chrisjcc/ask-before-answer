# -----------------------------------------------------------------------------
# GRPO Sweep Configuration
# -----------------------------------------------------------------------------
# Weights & Biases Bayesian sweep configuration for GRPO hyperparameter search.

# --- Sweep Settings ---
name: grpo-bayes-hyperband
description: >
  Bayesian hyperparameter sweep for the train-grpo pipeline.
  Searches GRPO beta and learning rate while maximizing train/rewards/accuracy_reward/mean using
  Hyperband early stopping.
project: ask-before-answer
program: scripts/run_sweep_trial.py
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--stage"
  - "train-grpo"
  - ${args}
method: bayes
metric:
  name: train/rewards/accuracy_reward/mean
  goal: maximize

# Enable Hyperband Early Stopping
early_terminate:
  type: hyperband
  # min_iter counts logged data points. Since GRPO has logging_steps=10,
  # min_iter: 20 means the first cut happens at 200 global training steps.
  # We use the train reward metric because eval generations in GRPO are too slow.
  min_iter: 20
  eta: 3          # Hyperband bracket multiplier.

# --- Parameters ---
parameters:
  beta:
    distribution: uniform
    min: 0.01
    max: 0.2
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-4
